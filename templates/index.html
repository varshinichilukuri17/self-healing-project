<!DOCTYPE html>
<html>
<head>
    <title>System Monitoring Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #121212;
            color: white;
            text-align: center;
        }
        .card {
            background: #1e1e1e;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            display: inline-block;
            width: 250px;
        }
    </style>
</head>
<body>

    <h1>Self-Healing Monitoring Dashboard</h1>

    <div class="card">
        <h2>CPU Usage</h2>
        <p>{{ cpu }}%</p>
    </div>

    <div class="card">
        <h2>Memory Usage</h2>
        <p>{{ memory }}%</p>
    </div>

    <div class="card">
        <h2>Disk Usage</h2>
        <p>{{ disk }}%</p>
    </div>

    <div class="card">
        <h2>Uptime</h2>
        <p>{{ uptime }} seconds</p>
    </div>

</body>
</html>
